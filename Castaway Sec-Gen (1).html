<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castaway Sec-Gen</title>
<style>
:root{--bg:#06232b;--fg:#fff3d1;--panel:#0e4a52;--gold:#ffc94a;--red:#e2552b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--bg:#06232b}
:root[data-theme="dark"]{--bg:#06232b}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px;box-sizing:border-box;overflow-y:auto;min-height:100%}
header,footer,.stage{width:100%;max-width:1180px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:clamp(18px,3.4vw,28px);margin:0;font-weight:800}
#count{background:var(--panel);border:2px solid var(--gold);border-radius:999px;padding:4px 14px;font-size:clamp(14px,2.4vw,18px);white-space:nowrap}
.stage{display:flex;gap:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#wrap{position:relative;flex:1 1 560px;max-width:min(940px,calc((100vh - 170px)*1.538));min-width:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:800/520;border-radius:14px;border:4px solid var(--panel);background:#000;cursor:pointer;touch-action:none}
#toast{position:absolute;left:50%;top:14%;transform:translate(-50%,-20px) scale(.8);opacity:0;pointer-events:none;background:var(--panel);border:3px solid var(--gold);border-radius:16px;padding:12px 22px;text-align:center;transition:.35s cubic-bezier(.2,1.4,.4,1)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast b{display:block;font-size:42px;line-height:1.2}
#toast span{font-size:clamp(15px,2.6vw,20px)}
#manifest{flex:0 0 210px;background:#f3e6c4;color:#3a2a14;border:3px solid #8a6a3a;border-radius:6px;padding:12px 14px;box-shadow:3px 4px 0 rgba(0,0,0,.35)}
#manifest h2{margin:0 0 6px;font-size:18px;border-bottom:2px solid #3a2a14;padding-bottom:4px}
#man{list-style:none;margin:0;padding:0}
#man li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #9a7a4a;font-size:15px}
#man .e{width:22px;text-align:center}
#man .l{flex:1}
#man .n{font-weight:800;font-variant-numeric:tabular-nums}
#empty{margin:4px 0;font-size:14px;font-style:italic;opacity:.7}


#man li.flash{animation:fl .7s}
@keyframes fl{0%{background:#ffd54a}100%{background:transparent}}
#mt{margin:8px 0 0;font-size:13px;opacity:.8}
@media (max-width:860px){#manifest{flex:1 1 100%}#man{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}}
footer{display:flex;align-items:center;gap:14px;justify-content:space-between}
#hint{font-size:clamp(12px,2vw,15px);opacity:.85;margin:0;line-height:1.4}
#open{font:inherit;font-size:18px;font-weight:800;background:var(--red);color:#fff;border:3px solid var(--gold);border-radius:12px;padding:10px 22px;cursor:pointer;opacity:.35;transition:.2s;flex:none}
#open.ready{opacity:1;transform:scale(1.05)}
#open:focus-visible{outline:3px solid #fff;outline-offset:2px}
header{flex-wrap:wrap}
#lv{font-size:clamp(13px,2.2vw,16px);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#lv button{font:inherit;width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);background:var(--panel);color:var(--fg);cursor:pointer;font-weight:800}
#lv button.on{background:var(--gold);color:#3a2a14}
#lv button:disabled{opacity:.35;cursor:not-allowed}
#next{font:inherit;font-size:18px;font-weight:800;background:#2f9e4f;color:#fff;border:3px solid var(--gold);border-radius:12px;padding:10px 22px;cursor:pointer;flex:none;animation:pulse 1s infinite alternate}
#next[hidden]{display:none}
@keyframes pulse{to{transform:scale(1.06)}}
#sneak{font:inherit;font-size:17px;font-weight:800;background:#2d4a66;color:#fff;border:3px solid var(--gold);border-radius:12px;padding:10px 18px;cursor:pointer;flex:none}
#sneak[hidden]{display:none}
</style>
</head>
<body>
<header><h1>Castaway Sec-Gen</h1><div id="lv"></div><div id="count">Crates: 0 / 14</div></header>
<div class="stage">
<div id="wrap"><canvas id="c" width="800" height="520" aria-label="Tropical beach with washed-up shipping crates. Move around and open them."></canvas><div id="toast"><b id="te"></b><span id="tt"></span></div></div>
<aside id="manifest"><h2>Cargo manifest</h2><p id="empty">Nothing found yet. Open crates to fill your inventory.</p><ul id="man"></ul><p id="mt">0 of 14 crates opened</p></aside>
</div>
<footer><p id="hint">Move with WASD or arrow keys, or tap/click where you want to go. Stand next to a crate, then press E or Space to pry it open.</p><button id="open" type="button">Open crate</button><button id="sneak" type="button" hidden>Sneak: off</button><button id="next" type="button" hidden>Next level ▶</button></footer>
<script>

let N=0;const pal=[['#c8512a','#ffd29a'],['#3a6b8c','#cfe6f5'],['#c9a227','#fff1b0'],['#4f8a4b','#d4f0c8'],['#8a4f9e','#ecd2f5'],['#2d8f8f','#c8f2ee'],['#b8352f','#ffd0cc']];
let gifts=[],solid=[],palms=[],lv=0,unlocked=0,fade=0,en=[],invOn=false,spawnN=0,spawnT=0,slow=0,flash=0,carry=null,loaded=0,dep=0,shipX=190,win=0,winT=0,pops=[],peek=0,run=0,warned=0,sneakOn=false,mv=0,hp=9,ivt=0;

{n:'Level 2: Container Grove',d:[[85,250,'fruit','🍍'],[85,330,'fruit','🥭'],[85,410,'fruit','🍌'],[85,480,'fruit','🥥'],[715,250,'fruit','🥭'],[715,330,'fruit','🍍'],[715,410,'fruit','🥥'],[715,480,'fruit','🍌'],[230,222,'fruit','🍌'],[340,222,'fruit','🍍'],[460,222,'fruit','🥭'],[570,222,'fruit','🥥']],s:[[0,175,45,345],[755,175,45,345],[200,300,160,36],[440,380,160,36]],p:[[130,178,'ban'],[285,176,'man'],[400,178,'pine'],[515,176,'man'],[670,178,'ban'],[225,320,'pine'],[280,318,'ban'],[335,320,'pine'],[465,400,'man'],[520,398,'ban'],[575,400,'man']],sx:400,sy:470},
{n:'Level 3: Jungle Outpost',d:[[190,335,'rat','🥫'],[300,400,'rat','🥫'],[480,335,'radio','📻'],[620,400,'tools','🔧'],[100,470,'boots','🥾'],[560,470,'aid','🩹'],[670,330,'rope','🪢'],[380,470,'lamp','🏮'],[60,310,'contract','📜']],s:[[60,218,20,20],[280,215,160,70],[100,225,150,56],[30,343,20,20],[240,483,20,20],[480,205,90,56],[610,220,34,34],[655,230,66,36],[90,298,250,16],[385,298,315,16],[540,300,46,40],[150,400,46,40]],p:[[70,235,1],[40,360,1],[250,500,1]],sx:360,sy:340},

const lvEl=document.getElementById('lv'),nb=document.getElementById('next');

nb.onclick=()=>loadLevel(lv+1);
function levelDone(){if(lv==1)nb.hidden=false;else if(lv==2)startInv()}
function isSneak(){return !!keys.shift||sneakOn}
function spd(){if(lv==1)return (isSneak()?.45:1)*Math.max(.3,1-.055*opened);return slow>0?.45:1}
function hush(dt){if(lv!=1)return;if(peek>0){peek-=dt;if(peek<=0){peek=0;run=0;warned=0;tst('🤫','The soldier moved on. Keep taking fruit... quietly!')}return}
if(mv&&!isSneak()){run+=dt;if(run>.5&&!warned){warned=1;tst('🔊','You are being too loud, be more sneaky!')}if(run>3){peek=3;run=0;tst('👀','FREEZE! A soldier is peeking in!')}}
else{run=Math.max(0,run-dt*1.5);if(run==0)warned=0}}
function drawSack(b){const s=1+.24*opened;g.save();g.translate(-7,12);g.rotate(Math.sin(p.bob*.5)*.05);g.scale(s,s);g.fillStyle='#b8975a';g.beginPath();g.ellipse(0,-13,13,14,0,0,6.28);g.fill();g.fillStyle='#a07f45';g.beginPath();g.ellipse(-4,-10,5,9,0,0,6.28);g.fill();rr(-4,-30,8,6,'#a07f45');rr(-6,-27,12,2,'#6e4a28');const fc=['#f2c230','#e8a020','#ff8a3d','#7cc04a','#e8452c'];for(let i=0;i<opened;i++){g.fillStyle=fc[i%5];g.beginPath();g.arc(((i*37)%18)-9,-6-((i*53)%16),3,0,6.28);g.fill()}g.restore()}

function restart(){for(const k in got)got[k]=0;man.innerHTML='';document.getElementById('empty').style.display='';loadLevel(0)}
function outpost(n,t){if(n<1)return;g.fillStyle='#9a7b4a';g.beginPath();g.ellipse(390,262,330,66,0,0,6.28);g.fill();outpostOld(n>=9?9:n>=6?8:n>=2?6:1,t);
if(n>=3){rr(100,238,150,43,'#8a6a40');for(let x=100;x<250;x+=10)rr(x,238,2,43,'#6e4f2c');g.fillStyle='#4f6a3a';g.beginPath();g.moveTo(94,240);g.lineTo(175,208);g.lineTo(256,240);g.fill();for(const x of[110,136,206,230])rr(x,252,14,12,'#2d4a66');rr(168,258,16,23,'#3a2616')}
if(n>=4){rr(480,222,90,38,'#9a7448');for(let x=480;x<570;x+=10)rr(x,222,2,38,'#7a5a34');rr(474,210,102,14,'#8f989e');rr(512,236,26,24,'#3a2616');rr(485,250,14,10,'#c9a227');rr(550,248,14,12,'#c8512a')}
if(n>=5){rr(612,152,4,102,'#5a3e20');rr(638,152,4,102,'#5a3e20');g.strokeStyle='#5a3e20';g.lineWidth=2;g.beginPath();g.moveTo(614,254);g.lineTo(640,190);g.moveTo(640,254);g.lineTo(614,190);g.stroke();rr(604,150,44,8,'#7a5a34');rr(608,122,36,28,'#8a6a40');g.fillStyle='#b8452f';g.beginPath();g.moveTo(602,124);g.lineTo(626,104);g.lineTo(650,124);g.fill();rr(616,130,20,10,'#2d4a66')}
if(n>=7){for(let x=90;x<=700;x+=12){if(x>336&&x<388)continue;rr(x,296,8,20,'#6e4a28');rr(x,294,8,4,'#8a6238')}}
if(n>=8){g.fillStyle='#d8c9a0';g.beginPath();g.moveTo(650,266);g.lineTo(688,222);g.lineTo(726,266);g.fill();g.fillStyle='#7a6a40';g.beginPath();g.moveTo(678,266);g.lineTo(688,240);g.lineTo(698,266);g.fill();const f=1+.2*Math.sin(t*9);g.fillStyle='#ff9a2e';g.beginPath();g.ellipse(620,282,8*f,11*f,0,0,6.28);g.fill();g.fillStyle='#ffe27a';g.beginPath();g.ellipse(620,284,4*f,6*f,0,0,6.28);g.fill();rr(610,286,20,4,'#5a3e20')}
if(n>=9){rr(334,286,6,32,'#5a3e20');rr(388,286,6,32,'#5a3e20');rr(334,286,60,4,'#5a3e20');g.fillStyle='#c9b47a';for(let i=0;i<5;i++){g.beginPath();g.ellipse(262+i*14,290,8,5,0,0,6.28);g.fill()}}}
const hintEl=document.getElementById('hint'),H0=hintEl.textContent;
const sb=document.getElementById('sneak');sb.onclick=()=>{sneakOn=!sneakOn;sb.textContent='Sneak: '+(sneakOn?'on':'off');sb.blur()};
function tst(e,x){const t=document.getElementById('toast');document.getElementById('te').textContent=e;document.getElementById('tt').textContent=x;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),2800)}
function intro(i){peek=0;run=0;warned=0;sneakOn=false;sb.hidden=i!=1;sb.textContent='Sneak: off';hintEl.textContent=i==3?'Press E near a crate to pick it up, carry it to the docked ship, then press E again to load it.':i==2?'Open each crate to build up the outpost.':i==1?'Press E at each crate to stuff its fruit into your sack. Hold Shift (or tap Sneak) to creep quietly. Running is loud!':H0;if(i==3){document.getElementById('count').textContent='Loaded: 0 / '+N;document.getElementById('mt').textContent='0 of '+N+' crates loaded';tst('📦','Load every crate onto the ship!')}if(i==2)tst('🏕️','Every crate you open adds to the outpost!');if(i==1)tst('🤫','You are stealing this fruit. Stay quiet!')}
function zone(){return lv==3&&!!carry&&dep==0&&p.y<238&&p.x>75&&p.x<305}
function harbor(){if(dep>0||win)return;if(!carry){if(near){carry=near;near.carried=true}return}if(!zone())return;const q=carry;q.carried=false;q.done=true;carry=null;loaded++;document.getElementById('count').textContent='Loaded: '+loaded+' / '+N;document.getElementById('mt').textContent=loaded+' of '+N+' crates loaded';for(let i=0;i<14;i++)parts.push({x:150+Math.random()*80,y:150,vx:(Math.random()-.5)*160,vy:-80-Math.random()*80,l:.8,c:cc[i%5]});if(loaded==N){dep=.001;tst('⚓','All loaded! Setting sail for America!');hintEl.textContent='Sailing for America...'}}

function boatAway(){invOn=false;en=[];tst('⛵','Escaped! Sailing to the harbor...');setTimeout(()=>loadLevel(3),1100)}
function inv(dt){if(invOn){spawnT-=dt;if(spawnN<16&&spawnT<=0){spawnT=.9;spawnN++;const l=spawnN%2;en.push({x:l?30:60+Math.random()*680,y:l?200+Math.random()*270:495,cd:.8,sw:0,v:80+Math.random()*25})}}

function frame(ms){const t=ms/1000,dt=Math.min(.05,t-last);last=t;mv=0;step(dt);if(lv==0&&opened==N&&p.y<228&&p.x>748&&p.x<762){loadLevel(1)}if(lv==2&&invOn&&Math.hypot(p.x-765,p.y-218)<30)boatAway();inv(dt);dockStep(dt);hush(dt);
